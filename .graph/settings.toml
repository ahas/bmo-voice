repository = "bmo-voice"
base = false

[coverage]
# Every Cargo package's src/ from the bmo-next layout, and the Bun and Python projects beside it: the node and
# training scripts, the script studio's tools and its screen, and the Python side under synth/. The tests stand
# outside the index, and no file in the scope is left unnamed.
layout = "bmo-next"
extensions = ["rs", "ts", "vue", "py"]
roots = ["scripts/", "studio/", "synth/"]
