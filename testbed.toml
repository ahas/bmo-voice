# How the testbed tests, checks, builds and deploys this repository, in the testbed's declaration format.

testbed = 0
name = "bmo-voice"

# The Cargo crate, and the Bun projects of their own found by their manifests and lockfiles. The crate's tests
# stand in tests/ (README.md, 「Tests」); the quick checks hold the personal-data rule.
[test]
languages = ["cargo", "bun"]
# The Python tests' own interpreter, tests/.venv, made from tests/python-requirements.txt (README.md, 「Tests」),
# and the Bun projects' packages, which their checks, the node scripts and the studio's tools and screen stand on; a
# release runs them too.
setup = [
  "uv venv --quiet --allow-existing --python 3.12 tests/.venv && uv pip install --quiet --python tests/.venv/bin/python -r tests/python-requirements.txt",
  "cd scripts && bun install --frozen-lockfile",
  "cd studio && bun install --frozen-lockfile",
  "cd studio/client && bun install --frozen-lockfile",
]

[check]
# The sweeps that read the tree before anything runs: Korean in the code, the README's folder table and the
# dependencies the manifests name, and the shared versions the manifests and the lock hold to. The ledger is the
# Korean allowed per code file.
quick = ["korean", "layout", "dependencies", "cargo-profile", "shared-versions", "personal-data"]
# The one address docs/PERSONAL-DATA.md allows.
personal_data_allowed = ["dev@ahas.io"]
korean_ledger = "korean-ledger.json"
# The base libraries every unit may build on. The voice reaches every other unit through the routes and commands
# `docs/boundary-api.md` states.
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-ui", "bmo-text"]

# The repository whose root holds the shared versions the manifests and the lock hold to.
[check.shared_versions]
repository = "bmo-chat"

# No static step is declared for the crate. The testbed's own Cargo workspace check formats and lints every
# member, every target compiled, through its Cargo verb in the shared build directory, wherever a change marks a
# crate, and the change check compiles every crate a change marks; a change that marks none has no Rust to judge.

[build]
# The service, the unit command, the script studio's server and the hosted tool, into the release's bin/.
binaries = ["voice-server", "bmo-voice", "script-studio", "voice-servers-tool"]

# The voice's own deploy tree and the shared data root its settings and everything it keeps stand under
# (docs/deploy.md).
[deploy]
root = "~/.local/share/bmo-voice"
link = "deploy"
data_root = "~/.local/share/bmo/data"
env_links = [{ link = "settings.toml", target = "env/voice.toml" }]
units = ["deploy/*.service"]
# Answers 0 once the service answers its health and the script studio its API with a sign-in asked for and its
# screen with HTML.
health = '''cd ~/.local/share/bmo-voice/deploy && bin/bmo-voice health && test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3214/bmo-script/api/assets)" = 401 && curl -sf http://127.0.0.1:3214/bmo-script/ | grep -qi '<html' '''

# The unit command, linked into the folder holding `bmo`, the first folder `bmo` looks for unit commands in. The
# link names this repository's deploy tree, whose own link stands across releases; a link made to the release
# being deployed would dangle once a later deployment prunes that release.
[[deploy.step]]
id = "link-unit-command"
phase = "before-flip"
command = '''
set -eu
bmo_dir="$(dirname "$(command -v bmo)")"
ln -sfn "$HOME/.local/share/bmo-voice/deploy/bin/bmo-voice" "$bmo_dir/bmo-voice"
'''

# The hosted tool is placed in its folder's .placed/, the folder the tool host reads (docs/deploy.md, 「The hosted
# tool」): the executable the release's bin/ holds, its manifest and its entries' input schemas, put into the tool
# host's registry for this service with the capabilities its entries ask for allowed.
[[deploy.step]]
id = "place-servers-tool"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/servers/.placed
mkdir -p tools/servers/.placed
cp bin/voice-servers-tool tools/servers/tool.toml tools/servers/servers.json tools/servers/generate.json tools/servers/voice_sound.json tools/servers/.placed/
bmo-pocket put tools/servers/.placed --placed --service voice --allow room.tools --allow room.send
'''

# The script studio's screen, generated into the release where its server serves it from.
[[deploy.step]]
id = "studio-screen"
phase = "before-flip"
command = "cd studio/client && BMO_SCRIPT_PACK=i18n/locales/ko.yaml BMO_SCRIPT_LANGUAGE=ko bun run generate"

# Every voice node brought up to date once the service answers, pushing only where a node's stamp differs.
[[deploy.step]]
id = "voice-nodes"
phase = "after-health"
command = "bun scripts/voice-node.ts sync"
