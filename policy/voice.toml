# The voice's own policy values (docs/boundary-api.md, 「The voice's policy」).

# The emotions a voice may be asked to speak with, one for each face a listener draws. A synthesis naming
# any other is refused.
emotions = ["기본", "기쁨", "슬픔", "놀람", "화남", "졸림", "폭소", "걱정", "아픔", "안간힘"]

# The engine every served voice belongs to (docs/voice-plan.md, 「The synthesiser」): a voice whose folder's
# `voice.toml` names another, or a folder with none, is kept and never spoken.
engine = "fish-s2-pro"

# The spans of the three clocks that end a synthesis nothing else would end (docs/boundary-api.md, 「The clocks」).
[clocks]
# A synthesis taken in through POST /syntheses that its caller has not read for this long fails: its caller has gone.
caller_gone_seconds = 120
# Each call a line makes to reach its node, the node service's target and each command on the node's shell, answers
# within this, or the line fails: its node did not answer.
node_answer_seconds = 60
# A line on its node whose stage and whose server's every line stand still for this long fails: it stood still.
node_still_seconds = 600
