# The voice server as the card master places it: on every node its placement names, joining the reservation of
# each, below every service that stands alone there, and sharing its card by its tier (the arbiter's
# docs/placement.md, 「A service declares itself」; docs/voice-plan.md, 「The voice nodes」). The adapter runs from
# this folder and is the node scripts' own (docs/layout.md).
service = "voice"
card_mib = 11600
priority = 40
spread = "many"
alone = false
adapter = ["bun", "../scripts/voice-node.ts", "adapter"]
