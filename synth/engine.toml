# The engine the voice servers speak with (docs/voice-plan.md, 「The environments」, 「Where the weights live」): the
# code checkout every voice node's engine environment is built from, and the base weights each node carries. The
# node scripts' `setup` reads it; nothing here is downloaded at runtime.

# Fish Audio's fish-speech, checked out at this commit and used as it stands. Its environment is built by uv from the
# checkout's own lockfile with the CUDA 12.9 extra; the microphone package is left out, since nothing here records.
[code]
repository = "https://github.com/fishaudio/fish-speech.git"
commit = "0f8a12e8a651062fdee9c33a894bdccd3a8513f1"
extra = "cu129"
python = "3.12"
leave_out = ["pyaudio"]

# The base weights, Fish Audio S2-Pro under the Fish Audio Research License (research and non-commercial use only).
# The operations machine holds them as this revision's snapshot in its Hugging Face cache; `setup` carries each file
# to a node's `bmo-voice/s2-pro/` where the node's copy is missing or its digest differs, and checks every copy.
[base]
repository = "fishaudio/s2-pro"
revision = "1de9996b6be38b745688de084d87a5633f714e4e"

