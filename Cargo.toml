# One crate: the voice service, its unit command and the script studio's server, split into modules, with a
# binary each under `src/bin/` (docs/layout.md). It heads the workspace whose other members are the hosted tools'
# crates, one line each by its folder.
[workspace]
resolver = "3"
members = [
  "tools/servers",
]

# One version for the whole repository (docs/boundary-api.md, 「Versions」).
[workspace.package]
version = "0.1.0-rev.40"
edition = "2024"
license = "MIT"
publish = false

# The registry crates every unit takes at one version and one feature set (bmo-chat's docs/conventions.md,
# 「Shared versions」), copied from its shared-versions.toml.
[workspace.dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
hyper = { version = "1.12.0", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "client-proxy", "client-proxy-system", "http1", "http2", "server", "service", "tokio"] }
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
tokio = { version = "1.53.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }

[package]
name = "bmo-voice"
description = "The voice engine: trained voices, speech synthesis on the voice nodes, transcription, speaker encodings, script readings and the script studio."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

[lib]
name = "bmo_voice"
path = "src/lib.rs"

# The service: the routes other units call (docs/boundary-api.md).
[[bin]]
name = "voice-server"
path = "src/bin/voice-server.rs"

# The unit command `bmo` hands the voice's commands to (docs/boundary-api.md, 「The unit command」).
[[bin]]
name = "bmo-voice"
path = "src/bin/bmo-voice.rs"

# The script studio's server (docs/script-studio.md).
[[bin]]
name = "script-studio"
path = "src/bin/script-studio.rs"

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
async-trait = "0.1.92"
# The time a studio export is stamped with.
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
# The `Cookie` and `Set-Cookie` headers read as browsers and servers write them.
cookie = "0.18.1"
# The studio's metadata CSV, written with the standard quoting.
csv = "1.4.0"
# A studio media request's `Range` header read as HTTP writes it.
http-range-header = "0.4.2"
# The type of a file of the studio's generated screen.
mime_guess = "2.0.5"
# A kept sound's Ogg pages read for its length.
ogg = "0.9.2"
# A screen path's encoded parts read back.
percent-encoding = "2.3.1"
# A video page's subtitle tracks, and a cue's text out of its markup, read as HTML is read.
scraper = "0.25.0"
# The service's open-files limit raised to its hard limit as it starts.
libc = "0.2.191"
# An asset named by the hash of its path, and a studio session token kept as its hash.
sha2 = "0.10.9"
# The provided subtitles, read as WebVTT is written.
subtp = "0.2.0"
# How many words a subtitle cue's words differ from a line's by.
strsim = "0.11.1"
# A studio media file streamed as an answer's body.
tokio-util = { version = "0.7.16", features = ["io"] }
# A request's origin and path read as URLs are.
url = "2.5.8"
# The service's routes.
axum.workspace = true
base64 = "0.22.1"
# A hub's token file, read as the dotenv file it is.
dotenvy = "0.15.7"
futures-util = "0.3.34"
bmo-text = { path = "../../base/text" }
# The unit command's words, read by the maintained reader of command lines.
clap = { version = "4.5.40", features = ["derive"] }
# The tool host's control socket, HTTP/1.1 over a Unix socket.
http-body-util = "0.1.3"
hyper.workspace = true
hyper-util.workspace = true
regex = "1.11.1"
reqwest.workspace = true
# The harness plugin's MCP server.
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
# The JSON Schemas of the wire bodies, the tools' inputs and outputs, and the OpenAPI document.
schemars = "1.2.3"
sea-orm = { version = "1.1.17", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"] }
sea-orm-migration = { version = "1.1.17", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1.0.219", features = ["derive"] }
# The records keep their keys in the order they were written, and every number exactly as written, as JavaScript
# reads them.
serde_json = { version = "1.0.140", features = ["float_roundtrip", "preserve_order"] }
# The language data files under data/, read as YAML.
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
thiserror = "2.0.17"
# A word quoted for a POSIX shell line.
shlex = "1.3.0"
# A hub's exec stream read as the server-sent events it is.
sse-stream = "0.2.6"
# A data file's templates filled by their {name} marks.
strfmt = "0.2.4"
rand = "0.9.2"
# The voice's own database, and the script studio's review database.
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "sqlite", "runtime-tokio"] }
tokio.workspace = true
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
tower = { version = "0.5.2", default-features = false, features = ["util"] }
# A kept sound served with the ranges a player asks for.
tower-http = { version = "0.6.6", default-features = false, features = ["fs"] }
# A path part of a unit's route percent-encoded.
urlencoding = "2.1.3"

# The build output is kept small: debug information down to line numbers, so a backtrace still reads in full and a
# binary links quickly, and no incremental state.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false

[profile.test.package."*"]
debug = false

[profile.release]
debug = false
strip = "debuginfo"
