# The script studio's two locations (docs/deploy.md, 「What a deployment does」): placed by hand inside the host's
# server block, which brings its own proxy headers. The path and the port are fixed, so a deployment never touches
# the proxy.
location = /bmo-script { return 308 /bmo-script/; }
location /bmo-script/ {
  proxy_pass http://127.0.0.1:3214;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
