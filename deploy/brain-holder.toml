# This service's standing line in every agent's brain: when to reach for it. How its tools are called is
# their manuals', handed with a tool's first call in a session.
held_by = "voice"

[[memory]]
key = "voice.when"
type = "tip"
recall_condition = "say something aloud, another voice, or a transcription"
text = "Your own voice is bmo/speak, another voice voice/generate, and a transcription bmo listen."
