# The seed of the voice name table (docs/voice-plan.md, 「How names are said」): the rows a table first made is
# given. Each is a spelling and what a Korean stretch and an English stretch say in its place, empty where that
# language reads the spelling as it stands. These are the spellings the reading gate was heard to sound out or to
# say wrongly where Korean has a settled reading — names, and the months and days of a date — and English says each
# as written. The names a deployment's own agents and owner go by are that deployment's to add with
# `scripts/voice-names.ts --set` (docs/deploy.md).

