# What a Korean line is said with once it is made a script for a voice (docs/voice-plan.md, 「A line is spoken
# as a script」, 「How figures are said」): the words markup is unfolded into, the particles fitted to the sound
# before them, and the words a figure is read in. Each `{name}` is filled in with what it names. Every Korean
# line here is recorded in korean-ledger.json.

spoken:
  # The ordinals a numbered item opens with, from the first to the twentieth; past them the item's figure
  # is said with figures.ordinal after it.
  ordinals:
    - 첫째
    - 둘째
    - 셋째
    - 넷째
    - 다섯째
    - 여섯째
    - 일곱째
    - 여덟째
    - 아홉째
    - 열째
    - 열한째
    - 열두째
    - 열셋째
    - 열넷째
    - 열다섯째
    - 열여섯째
    - 열일곱째
    - 열여덟째
    - 열아홉째
    - 스무째
  # The particle a title takes before what it heads, fitted to how the title ends.
  title_particle: 는
  # What is said where a Korean word is written straight onto a web address.
  address: 주소
  # The words that already name a web address, after which the address only goes and the word takes its
  # particle.
  address_words:
    - 주소
    - 링크
  # The endings that make a line polite where they close a sentence or a line.
  polite_endings:
    - 요
    - 니다
  # The one sentence closing a script its web addresses were taken out of: in a casual line, in a polite
  # line, and in a line holding English and no Korean.
  # Runs said in one breath, each as its reading spelled part by part and then as it is written for the voice: the
  # decimal point tensed and its final consonant carried onto the figure after it, letter names run together; a
  # number's own words kept as they are spelled, with nothing carried onto the figure or the unit after them; and a
  # number too long for one breath, broken after its hundreds with its counter written onto its last run. The model
  # that writes a line's spoken words is shown them as examples.
  sounded:
    - [오점오, 오쩌모]
    - [칠점이, 칠쩌미]
    - [영점오점오, 영쩌모쩌모]
    - [구십구점오, 구십구쩌모]
    - [십이 퍼센트, 십이퍼센트]
    - [삼십일점오 퍼센트, 삼십일쩌모퍼센트]
    - [브이엘엘엠, 브이에레렘]
    - [유알엘, 유아렐]
    - [삼천오백십 번, 삼천오백 십번]
    - [삼천오백이십삼 번, 삼천오백 이십삼번]
    - [만이천삼백사십오 개, 만이천삼백 사십오개]
  attached: "주소는 첨부했어."
  attached_polite: "주소는 첨부했어요."
  attached_english: "I've attached the link."

particles:
  # Each particle that changes with the sound before it, as its form after a syllable closed by a
  # consonant and its form after an open one.
  pairs:
    - [은, 는]
    - [을, 를]
    - [이, 가]
    - [과, 와]
    - [이랑, 랑]
    - [이라고, 라고]
    - [이라는, 라는]
    - [이라서, 라서]
    - [이라도, 라도]
    - [이라면, 라면]
    - [이라, 라]
    - [이란, 란]
    - [이야, 야]
    - [이나, 나]
    - [이며, 며]
    - [이고, 고]
    - [이든지, 든지]
    - [이든, 든]
    - [이다, 다]
    - [이에요, 예요]
  # The pairs whose open form also follows a syllable closed by ㄹ, written as the pairs above are.
  open_after_rieul:
    - [으로, 로]

figures:
  # The figures 0 to 9 said one by one, and in Sino-Korean.
  digits: [영, 일, 이, 삼, 사, 오, 육, 칠, 팔, 구]
  # The places of a group of four figures, from the ones to the thousands.
  places: ["", 십, 백, 천]
  # The groups of four figures a whole number is grouped by, from the lowest.
  groups: ["", 만, 억, 조, 경]
  # The native counts one to nine as a counter takes them, nothing for zero.
  native_ones: ["", 한, 두, 세, 네, 다섯, 여섯, 일곱, 여덟, 아홉]
  # The native tens, ten to ninety, nothing for zero.
  native_tens: ["", 열, 스물, 서른, 마흔, 쉰, 예순, 일흔, 여든, 아흔]
  # The native counts one to nine as they are said alone, nothing for zero.
  native_ones_alone: ["", 하나, 둘, 셋, 넷, 다섯, 여섯, 일곱, 여덟, 아홉]
  # Twenty as a counter takes it with no ones after it.
  twenty: 스무
  # Zero as it is also said figure by figure.
  zero: 공
  # The figures 0 to 9 as a name's figures are said in English, one by one.
  english_digits: [제로, 원, 투, 쓰리, 포, 파이브, 식스, 세븐, 에잇, 나인]
  # One as an ordinal says it before figures.ordinal.
  first: 첫
  # The months said otherwise than their Sino-Korean figure, by the figure.
  months:
    "6": 유
    "10": 시
  # The counters a figure before them is said natively for.
  native_counters:
    - 개
    - 명
    - 마리
    - 사람
    - 살
    - 시간
    - 달
    - 가지
    - 장
    - 권
    - 잔
    - 병
    - 벌
    - 켤레
    - 그루
    - 송이
    - 척
    - 채
    - 곳
    - 군데
    - 줄
    - 판
    - 통
    - 방
    - 알
    - 칸
    - 바퀴
    - 차례
    - 자루
    - 끼
    - 밤
    - 걸음
    - 개비
    - 포기
    - 모금
  # The syllables a particle or an ending may open with after a counter, for the counter to be a word of
  # its own: so 1달러 is not a month counted, nor 3대학 machines.
  counter_ends: 이가을를은는에의도만까부로으와과째씩나쯤마밖보처였인라랑께뿐요야지다면며고든치짜동정반전후간내당들한예네거하경말초중
  # The hour counter, whose figure is native from 1 to 12.
  hour: 시
  # The ordinal counter, whose figure is native and opens on figures.first.
  ordinal: 번째
  # The counter of machines, native below ten and an age above it.
  machines: 대
  # The month counter, whose figure is a month.
  month: 월
  # The counter of months counted, said in Sino-Korean.
  months_counted: 개월
  # The word an item number is said with, unless the line writes it after the number already.
  item: 번
  # A date by its {year}, {month} and {day}, each said already.
  date: "{year}년 {month}월 {day}일"
  # A clock time's {hours}, {minutes} and {seconds}, each said already; a part that is zero is left out.
  hours: "{hours}시"
  minutes: "{minutes}분"
  seconds: "{seconds}초"
  # Two figures a colon apart that make no time, as a ratio of {left} to {right}.
  ratio: "{left} 대 {right}"
  # A fraction of {top} over {bottom}.
  fraction: "{bottom}분의 {top}"
  # The decimal point, between a whole part and its figures, and between the parts of a version.
  point: 점
  # The decimal point as it sounds in one breath, tensed.
  point_tensed: 쩜
  # An {amount} of dollars and of won.
  dollars: "{amount} 달러"
  won: "{amount} 원"
  # A sign opening a figure.
  plus: 플러스
  minus: 마이너스
  # A tilde between two figures, said after the first of them.
  range: 에서
  # The marks a figure is written with that are said, each as it follows the figure, a space before it
  # where one is said.
  symbols:
    "%": " 퍼센트"
    "°": 도
    "℃": 도
  # The other words a percent sign is said in.
  percent_also: [프로]
