# The Korean material the training lines' writer cannot do without (docs/voice-lines.md): what its English
# instructions, `prompts/voice-lines.md`, are filled in with, and what a row it writes is held to. Every line holding
# Korean is in `korean-ledger.json`.

# Words for which everyday Korean keeps the Sino-Korean word or the loanword, as examples.
everyday = "위치, 질문, 툴바, 서버"

# The words of meta talk, which call the agent's world a story: refused in a row and named in the instructions.
meta = ["만화", "시리즈", "에피소드", "캐릭터", "작품", "원작", "제작자", "성우"]

# The letter runs a chat writes laughter with, and laughter written as it is said.
letter_runs = "ㅋ or ㅎ"
laughter = "하하, 히히, 푸하하"

# How a Korean speaker reads what a line writes: the rules the reading of every row follows.
reading = """
- Figures: a plain number in Sino-Korean (921 → 구백이십일, 12,345 → 만 이천삼백사십오); an item number with 번 (#921 → 구백이십일번); a count before a native counter in native Korean up to 99 (3개 → 세개, 20명 → 스무명, 8시 → 여덟시, 1번째 → 첫번째); 6월 → 유월, 10월 → 시월; a decimal as its whole part, 점, and its digits one by one (0.25 → 영 점 이오); a version 1.10.2 → 일 점 십 점 이; a date 2026-09-28 → 이천이십육년 구월 이십팔일; an hour native only from 1 to 12 and Sino-Korean from 13 to 24 and at 0, minutes and seconds always Sino-Korean: 8:30 → 여덟시 삼십분, 14:20 → 십사시 이십분, 18:30 → 십팔시 삼십분, 00:10 → 영시 십분; a range 3~5개 → 세에서 다섯개; % → 퍼센트, ℃ → 도, $5 → 오 달러, -3 → 마이너스 삼.
- A figure in a model name digit by digit as part of the name (RTX 4070 → 알티엑스 사공칠공), and a quantity with a roman unit as a number (16GB → 십육 기가바이트, 120FPS → 백이십 에프피에스).
- Roman words by their sound, never their meaning: GPU → 지피유, API → 에이피아이, Docker → 도커, Proxmox → 프록스목스, SSD → 에스에스디, NASA → 나사, README → 리드미, log → 로그.
- The names listed below are always read as given.
- A command, a file name or a web address in full, by its parts, as a person reading it to someone would: bun packages/todo.ts → 번 패키지스 슬래시 투두 점 티에스, https://example.com/docs → 에이치티티피에스 이그잼플 점 컴 슬래시 독스, a hyphen inside a name as 하이픈 or dropped where people drop it, an underscore as 언더바.
- Brackets are dropped and their words kept where they are said. A symbol that is said is written as said (/ → 슬래시, & → 앤드, @ → 골뱅이); one nobody says is dropped.
"""

# The kinds a row names, by what each is: its label in a row and in the instructions.
[kinds]
statement = "평서"
question = "질문"
exclamation = "감탄"
mixed = "섞임"

# The length bands, counted in Hangul syllables of the reading, each with what a line of it is.
[[band]]
name = "한마디"
least = 1
most = 8
is = 'A word or a very short cry: "앗!", "좋아, 가자!", "하암, 졸려."'

[[band]]
name = "짧은 문장"
least = 9
most = 30
is = "One or two short sentences."

[[band]]
name = "보통 문장"
least = 31
most = 80
is = "Two to four sentences."

[[band]]
name = "긴 브리핑"
least = 81
most = 180
is = "A spoken briefing of four to eight short sentences, about half of them on the work: a job finished or stuck, a deploy, a test run, a machine, the news or the schedule."

# What each emotion a briefing may be spoken with sounds like in a line; every emotion of `policy/voice.toml` has one.
[emotions]
"기본" = "plain and even, a report or a remark with no strong feeling."
"기쁨" = "glad and bright, a success, good news, something fun."
"슬픔" = "sad and deflated, something lost, failed or missed; small and quiet, never a sermon."
"놀람" = "startled or amazed, something unexpected; 앗, 헉, 어?, 진짜?"
"화남" = "cross as a child sulks or stamps: at a bug, at being ignored, at a cheat in a game. Never cruel, sarcastic or swearing."
"졸림" = "sleepy and slow, yawning, about to nap or just woken; 하암, 으음, 졸려."
"폭소" = "bursting with laughter at something too funny; 푸하하, 히히, 아하하 written into the line."
"걱정" = "worried and careful, something might go wrong; 괜찮을까, 혹시, 조심해."
"아픔" = "hurt, a bump, an ache or a broken part; 아야, 으윽, 아파."
"안간힘" = "straining with all its might, lifting, pushing, holding on, trying hard; 끄응, 으라차, 조금만 더."

